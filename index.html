t-size:11px;font-weight:700;display:grid;gap:3px;justify-items:center}.bottom button.active{color:var(--green)}.bottom span{font-size:21px}}@media(max-width:620px){.main{padding:22px 15px 100px}h1{font-size:29px}.hero{padding:22px;gap:8px}.ring{width:88px;height:88px;padding:6px}.ring strong{font-size:23px}.grid{gap:8px}.card{padding:14px}.stat strong{font-size:23px}.items{grid-template-columns:1fr}.wardrobe{grid-template-columns:repeat(2,1fr)}.fields{grid-template-columns:1fr}.weather-days{grid-template-columns:repeat(5,1fr)}.day{padding:8px 3px;font-size:10px}.top .btn{padding:9px;font-size:12px}}@media print{.sidebar,.bottom,.btn,.travellers,.iconbtn{display:none!important}.main{padding:0}.shell{display:block}.hero{color:black;background:white;border:1px solid #ddd}.hero .muted{color:#444}}
h1,h2,h3,.logo,.hero strong{font-family:"Manrope","DM Sans",sans-serif}.logo{letter-spacing:-1px}.hero{background:linear-gradient(125deg,#153e35,#266b58 75%,#41876a);box-shadow:0 15px 35px #183f3220}.card,.garment{box-shadow:0 4px 22px #1c392608}.btn{transition:transform .15s,background .15s}.btn:hover{transform:translateY(-1px)}.garment{border-radius:21px;transition:transform .2s,box-shadow .2s}.garment:hover{transform:translateY(-3px);box-shadow:0 13px 28px #1c39261b}.garment-img{height:220px;position:relative;background:linear-gradient(140deg,#e9f1e9,#f8eee1)}.garment-img img{object-fit:contain;padding:9px}.photo-placeholder{display:grid;place-items:center;gap:5px}.photo-placeholder span{font-size:55px}.photo-placeholder small{font-size:10px;letter-spacing:1.5px;color:#84958b;font-weight:800}.garment-chip{position:absolute;left:12px;top:12px;border-radius:100px;background:#fffffff0;color:#345a4c;padding:5px 11px;font-size:11px;font-weight:800;box-shadow:0 3px 12px #00000010}.garment-body{padding:16px}.garment-body b{font-size:15px}.garment-actions{display:flex;gap:6px;margin-top:13px}.wardrobe-filters{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 21px}.filter{border:1px solid #dce6dd;border-radius:100px;background:white;padding:8px 17px;font-weight:700;color:#627a6d}.filter.active{background:#194e41;color:white;border-color:#194e41}.location-suggestions{position:relative;z-index:4;box-shadow:0 10px 20px #12321f12;border-radius:12px;overflow:hidden}.location-option{display:flex;gap:11px;align-items:center;text-align:left;width:100%;border:1px solid #e4ebe5;background:#fff;padding:10px 12px;color:#243f33;cursor:pointer}.location-option:hover{background:#eff7f0}.location-option small{display:block;font-weight:400;color:#829088}.field:has(#destination){position:relative}@media(max-width:620px){.garment-img{height:170px}.garment-actions{flex-wrap:wrap}}  .save-toast{position:fixed;right:24px;bottom:26px;background:#183f34;color:white;padding:13px 20px;border-radius:14px;box-shadow:0 12px 35px #123b2a35;font-weight:750;z-index:30;animation:toastin .2s ease-out}@keyframes toastin{from{transform:translateY(12px);opacity:0}to{transform:translateY(0);opacity:1}}@media(max-width:1000px){.save-toast{bottom:86px;right:14px;left:14px;text-align:center}} </style></head><body><div id="app"></div><script>
const KEY='dfs-trip-packer-v1';const id=()=>Math.random().toString(36).slice(2,10);const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const icons={Clothing:'👕',Shoes:'👟',Toiletries:'🧴',Electronics:'🔌',Documents:'🪪',Health:'🩹',Other:'🧳'};
const starter=['T-shirts|Clothing','Underwear|Clothing','Socks|Clothing','Sleepwear|Clothing','Shorts / trousers|Clothing','Jacket / jumper|Clothing','Walking shoes|Shoes','Toothbrush|Toiletries','Toothpaste|Toiletries','Deodorant|Toiletries','Skincare|Toiletries','Phone charger|Electronics','Travel documents|Documents','Medication|Health'].map(s=>{let [name,category]=s.split('|');return {id:id(),name,category,qty:1,packed:false,owner:'person'}});let db;try{db=JSON.parse(localStorage.getItem(KEY))}catch{}if(!db||!Array.isArray(db.trips))db={trips:[{id:id(),name:'My next getaway',destination:'',start:'',end:'',people:[{id:id(),name:'Traveller 1'}],items:[],clothes:[],outfits:[]}],active:null};if(!db.active||!db.trips.some(t=>t.id===db.active))db.active=db.trips[0].id;
const clothingCategories=['Top','Bottom','Dress','Shorts','Jacket','Shoes','Swimwear','Underwear','Accessories','Sleepwear','Other'];let locationMatches=[],locationTimer=null,selectedLocation=null,wardrobeCategory="All";let weatherKey='',weatherLastAttempt=0;let toastMessage='',toastTimer=null;let tab='dashboard',person='all',modal='',weather=null,weatherError='',weatherLoading=false;const trip=()=>db.trips.find(t=>t.id===db.active);const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(db));return true}catch(e){alert('Could not save. Browser storage may be disabled or full. Export a backup before leaving.');return false}};function notify(msg='Saved successfully'){toastMessage=msg;clearTimeout(toastTimer);render();toastTimer=setTimeout(()=>{toastMessage='';render()},2800)};const people=()=>trip().people;const pName=pid=>pid==='shared'?'Shared':people().find(p=>p.id===pid)?.name||'Unknown';const personOptions=(shared=true)=>people().map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')+(shared?'<option value="shared">Shared essentials</option>':'');const scoped=arr=>arr.filter(x=>!x.deletedAt&&(person==='all'||x.owner===person));const count=()=>{let a=trip().items.filter(x=>!x.deletedAt);return [a.filter(x=>x.packed).length,a.length]};const navs=[['dashboard','◫','Overview'],['packing','☑','Packing'],['wardrobe','♧','Wardrobe'],['outfits','✦','Outfits'],['settings','⚙','Trip setup']];
function render(){const t=trip(),[done,total]=count(),pct=total?Math.round(done/total*100):0;document.getElementById('app').innerHTML=`<div class="shell"><aside class="sidebar"><div class="logo">DFS<span>!</span></div><div class="eyebrow">DON’T FORGET YOUR SHIT.</div><nav>${navs.map(n=>`<button class="nav ${tab===n[0]?'active':''}" onclick="go('${n[0]}')">${n[1]} &nbsp; ${n[2]}</button>`).join('')}</nav><div style="margin-top:55px" class="note">Your lists are saved in this browser.<br>Weather powered by Open-Meteo.</div></aside><main class="main"><div class="top"><div><div class="eyebrow">PACK TOGETHER. FORGET NOTHING.</div><h1>${({dashboard:'Got your shit together?',packing:'Shit to pack',wardrobe:'The wardrobe',outfits:'What are we wearing?',settings:'The getaway'})[tab]}</h1></div><button class="btn ghost" onclick="openModal('trips')">⇄ Trips</button></div>${tab==='dashboard'?dashboard():tab==='packing'?packing():tab==='wardrobe'?wardrobe():tab==='outfits'?outfits():settings()}</main><div class="bottom">${navs.map(n=>`<button class="${tab===n[0]?'active':''}" onclick="go('${n[0]}')"><span>${n[1]}</span>${n[2]}</button>`).join('')}</div></div>${modal?modalHTML():''}${toastMessage?`<div class="save-toast" role="status">✓ ${esc(toastMessage)}</div>`:''}`}
function go(x){tab=x;render();if(x==='dashboard')scheduleWeather()}function pickPerson(x){person=x;render()}function tabsPeople(shared=true){return `<div class="travellers"><button class="traveller ${person==='all'?'active':''}" onclick="pickPerson('all')">Everyone</button>${people().map(p=>`<button class="traveller ${person===p.id?'active':''}" onclick="pickPerson('${p.id}')"><span class="avatar">${esc(p.name.slice(0,1).toUpperCase())}</span>${esc(p.name)}</button>`).join('')}${shared?`<button class="traveller ${person==='shared'?'active':''}" onclick="pickPerson('shared')">✦ Shared</button>`:''}</div>`}
function dashboard(){let t=trip(),[done,total]=count(),pct=total?Math.round(done/total*100):0;return `<section class="hero"><div><div class="eyebrow">LET’S GET YOUR SHIT TOGETHER</div><h1>${esc(t.name)}</h1><div class="muted">${esc(t.destination||'Add a destination')} ${t.start?' · '+esc(t.start):''}${t.end?' to '+esc(t.end):''}</div><div style="margin-top:20px"><button class="btn" style="background:white;color:#174d42" onclick="go('packing')">Continue packing →</button> <button class="btn" style="background:transparent;color:white;border:1px solid #ffffff88" onclick="go('settings')">Edit trip</button></div></div><div class="ring" style="--pct:${pct}"><div><strong>${pct}%</strong><small>PACKED</small></div></div></section><div class="grid"><div class="card stat"><strong>${people().length}</strong><small>Travellers</small></div><div class="card stat"><strong>${done}/${total}</strong><small>Items packed</small></div><div class="card stat"><strong>${t.outfits.length}</strong><small>Outfits planned</small></div></div><div class="section"><div class="section-head"><h2>What’s the weather doing?</h2><button class="btn ghost small" onclick="loadWeather(true)">↻ Refresh</button></div><div class="card" id="weatherbox">${weatherHTML()}</div></div><div class="section"><div class="section-head"><h2>Who's packing?</h2><button class="btn ghost small" onclick="go('settings')">Manage people</button></div><div class="grid">${people().map(p=>{let a=t.items.filter(x=>x.owner===p.id&&!x.deletedAt),n=a.filter(x=>x.packed).length;return `<div class="card"><div class="minirow"><span class="avatar">${esc(p.name.slice(0,1))}</span><b>${esc(p.name)}</b></div><p class="muted">${n} of ${a.length} items packed</p><div style="background:#e7eee8;border-radius:10px;height:7px"><div style="background:#36836c;height:7px;border-radius:10px;width:${a.length?n/a.length*100:0}%"></div></div></div>`}).join('')}</div></div>`}
function weatherHTML(){let t=trip();if(!t.destination)return `<p class="muted">Add a destination in Trip setup to see the forecast.</p><button class="btn soft" onclick="go('settings')">Set destination</button>`;if(weatherLoading)return '<p class="muted">Checking the forecast…</p>';if(weatherError)return `<p class="muted">${esc(weatherError)}</p><button class="btn soft" onclick="loadWeather(true)">Try again</button>`;if(!weather)return `<p class="muted">Weather will load automatically for ${esc(t.destination)}.</p><button class="btn soft" onclick="loadWeather(true)">Load now</button>`;let c=weather.current;let days=weather.daily.time.map((d,i)=>({d,i}));let tripStart=t.start?new Date(t.start+'T12:00'):null;let tripEnd=t.end?new Date(t.end+'T12:00'):null;let travelDays=days.filter(({d})=>{let dt=new Date(d+'T12:00');return tripStart&&dt>=tripStart&&(!tripEnd||dt<=tripEnd)});let display=travelDays.length?travelDays:days.slice(0,7);return `<div class="weather"><div style="font-size:45px">${symbol(c.weather_code)}</div><div><div class="temp">${Math.round(c.temperature_2m)}°C</div><div class="muted">Currently in ${esc(weather.place)} · Wind ${Math.round(c.wind_speed_10m)} km/h</div></div></div><div class="weather-days">${display.map(({d,i})=>{let dt=new Date(d+'T12:00'),tripDay=tripStart&&dt>=tripStart?Math.floor((dt-tripStart)/86400000)+1:null;return `<div class="day"><strong>${tripDay?'Day '+tripDay:'Forecast'}</strong><div>${dt.toLocaleDateString('en-AU',{weekday:'short',day:'numeric',month:'short'})}</div><div style="font-size:23px">${symbol(weather.daily.weather_code[i])}</div><b>${Math.round(weather.daily.temperature_2m_max[i])}° / ${Math.round(weather.daily.temperature_2m_min[i])}°</b></div>`}).join('')}</div><p class="note">${travelDays.length?'Forecast days overlapping your trip are shown.':'Showing upcoming forecast dates — your trip dates are outside the available forecast window.'} Open-Meteo forecasts are generally limited to around 16 days ahead.</p>`}
function symbol(c){return c===0?'☀️':c<=3?'⛅':c<=48?'🌫️':c<=67?'🌧️':c<=77?'❄️':c<=82?'🌦️':c<=86?'🌨️':'⛈️'}
async function getJson(url,ms=9000){let controller=new AbortController(),timer=setTimeout(()=>controller.abort(),ms);try{let r=await fetch(url,{signal:controller.signal});if(!r.ok)throw Error('Weather service returned '+r.status);return await r.json()}finally{clearTimeout(timer)}}
async function loadWeather(force=false){let t=trip(),dest=t.destination.trim(),tripId=t.id;if(!dest||weatherLoading)return;let key=[t.id,dest,t.start,t.end].join('|');if(!force&&weatherKey===key&&Date.now()-weatherLastAttempt<600000)return;weatherKey=key;weatherLastAttempt=Date.now();weather=null;weatherError='';weatherLoading=true;render();try{let g=t.location;if(!g||!Number.isFinite(Number(g.latitude))){let query=dest.split(',')[0].trim();let geo=await getJson('https://geocoding-api.open-meteo.com/v1/search?name='+encodeURIComponent(query)+'&count=7&language=en&format=json');if(!geo.results?.length)throw Error('Destination not found. Choose a city from Trip setup.');g=geo.results[0];let country=dest.split(',').map(x=>x.trim()).at(-1);let matching=geo.results.find(x=>x.country.toLowerCase()===country.toLowerCase());if(matching)g=matching}let u=`https://api.open-meteo.com/v1/forecast?latitude=${g.latitude}&longitude=${g.longitude}&current=temperature_2m,weather_code,wind_speed_10m&daily=weather_code,temperature_2m_max,temperature_2m_min&forecast_days=16&timezone=auto`;let result=await getJson(u);if(!result.current||!result.daily)throw Error('No forecast was returned.');if(trip().id!==tripId)return;weather=result;weather.place=g.name+', '+g.country}catch(e){if(trip().id!==tripId)return;weatherError=e.name==='AbortError'?'Weather request timed out. Check your connection and try again.':(e instanceof TypeError?'Unable to connect to the weather service. If you opened the HTML directly, try the hosted app once deployed.':e.message)}finally{if(trip().id===tripId){weatherLoading=false;render()}}}
function scheduleWeather(force=false){if(!trip()?.destination)return;if(force){weatherKey='';weather=null}setTimeout(()=>{if(!weatherLoading)loadWeather(force)},0)}
function packing(){let a=scoped(trip().items);return `${tabsPeople()}<div class="section-head"><div><h2>Shit to pack</h2><div class="muted">${a.filter(x=>x.packed).length} of ${a.length} packed</div></div><button class="btn" onclick="openModal('item')">+ Add item</button></div>${a.length?Object.keys(icons).map(cat=>{let b=a.filter(x=>x.category===cat);return b.length?`<div class="section"><div class="section-head"><h3>${icons[cat]} ${cat}</h3><span class="pill">${b.filter(x=>x.packed).length}/${b.length}</span></div><div class="items">${b.map(x=>`<div class="item"><button class="tick ${x.packed?'checked':''}" onclick="toggleItem('${x.id}')">${x.packed?'✓':''}</button><div class="details"><b style="${x.packed?'text-decoration:line-through;opacity:.55':''}">${esc(x.name)}</b><small>${esc(pName(x.owner))} · Qty ${x.qty}</small></div><button class="iconbtn" title="Edit" onclick="openModal('item','${x.id}')">✎</button><button class="iconbtn" title="Delete" onclick="remove('items','${x.id}')">×</button></div>`).join('')}</div></div>`:''}).join(''):`<div class="empty">No items yet. Add items, or load the starter essentials for each traveller.<br><br><button class="btn" onclick="addStarter()">Add starter packing lists</button></div>`}<div class="section"><button class="btn ghost" onclick="window.print()">Print checklist</button> <button class="btn ghost" onclick="resetPacked()">Reset packed status</button></div>`}
function wardrobe(){let a=scoped(trip().clothes),cats=['All',...clothingCategories,'Clothing'];let shown=a.filter(x=>wardrobeCategory==='All'||x.category===wardrobeCategory);return `${tabsPeople(false)}<div class="section-head"><div><h2>Your clothing, all in one place</h2><div class="muted">Photo-first wardrobe cards, just like Cruise Packer.</div></div><button class="btn" onclick="openModal('clothing')">+ Add clothing</button></div><div class="wardrobe-filters">${cats.map(c=>`<button class="filter ${wardrobeCategory===c?'active':''}" onclick="wardrobeCategory='${c}';render()">${c}</button>`).join('')}</div>${shown.length?`<div class="wardrobe">${shown.map(x=>`<div class="garment"><div class="garment-img">${x.photo?`<img src="${x.photo}" alt="${esc(x.name)}">`:`<div class="photo-placeholder"><span>${icons[x.category]||'👕'}</span><small>ADD A PHOTO</small></div>`}<span class="garment-chip">${esc(x.category)}</span></div><div class="garment-body"><b>${esc(x.name)}</b><small>${esc(pName(x.owner))}</small><div class="garment-actions"><button class="btn soft small" onclick="openModal('clothing','${x.id}')">✎ Edit item</button><button class="btn danger small" onclick="remove('clothes','${x.id}')">×</button></div></div></div>`).join('')}</div>`:`<div class="empty">Your wardrobe is waiting. Add your favourite pieces and upload a photo for each one.<br><br><button class="btn" onclick="openModal('clothing')">+ Add clothing</button></div>`}`} 
function outfits(){let a=scoped(trip().outfits);return `${tabsPeople(false)}<div class="section-head"><h2>Looks for the trip</h2><button class="btn" onclick="openModal('outfit')">+ Create outfit</button></div>${a.length?`<div class="grid">${a.map(o=>`<div class="card"><div class="look">${['top','bottom','shoes'].map(k=>{let c=trip().clothes.find(x=>x.id===o[k]);return `<div class="lookimg">${c?.photo?`<img src="${c.photo}" alt="">`:(c?icons[c.category]:'＋')}</div>`}).join('')}</div><h3>${esc(o.name)}</h3><p class="muted">${esc(pName(o.owner))} · ${esc(o.occasion||'Any occasion')}</p><button class="btn ghost small" onclick="openModal('outfit','${o.id}')">Edit outfit</button> <button class="btn danger small" onclick="remove('outfits','${o.id}')">Delete</button></div>`).join('')}</div>`:`<div class="empty">Combine clothing from your wardrobe into outfits for each traveller.<br><br><button class="btn" onclick="openModal('outfit')">Plan an outfit</button></div>`}`}
function settings(){let t=trip();return `<div class="section"><div class="section-head"><h2>Where are you heading?</h2></div><div class="card"><div class="fields"><label class="field">Trip name<input id="tripName" value="${esc(t.name)}"></label><label class="field">Destination<input id="destination" autocomplete="off" placeholder="Search for a city or destination…" oninput="searchDestination(this.value)" value="${esc(t.destination)}"><div id="locationSuggestions" class="location-suggestions"></div></label><label class="field">Departure date<input type="date" id="start" value="${esc(t.start)}"></label><label class="field">Return date<input type="date" id="end" value="${esc(t.end)}"></label></div><div style="margin-top:17px"><button class="btn" onclick="saveTrip()">Save trip details</button></div></div></div><div class="section"><div class="section-head"><h2>Travellers</h2><button class="btn" onclick="openModal('person')">+ Add traveller</button></div><div class="items">${people().map(p=>`<div class="item"><span class="avatar">${esc(p.name.slice(0,1))}</span><div class="details"><b>${esc(p.name)}</b><small>Personal wardrobe and packing list</small></div><button class="btn ghost small" onclick="openModal('person','${p.id}')">Edit</button><button class="iconbtn" onclick="removePerson('${p.id}')">×</button></div>`).join('')}</div></div><div class="section card"><h3>Recently Deleted</h3><p class="muted">Deleted packing items, wardrobe pieces and outfits can be restored.</p>${deletedHTML()}</div><div class="section card"><h3>Data and privacy</h3><p class="muted">This standalone edition saves your trip and photos locally in this browser. It does not yet sync across devices. Weather requires an internet connection.</p><button class="btn ghost" onclick="exportData()">Export backup</button> <label class="btn ghost" style="display:inline-block;cursor:pointer">Import backup<input type="file" accept="application/json" style="display:none" onchange="importData(this)"></label></div>`}
function deletedHTML(){let t=trip(),a=['items','clothes','outfits'].flatMap(k=>t[k].filter(x=>x.deletedAt).map(x=>({...x,kind:k})));return a.length?a.map(x=>`<div class="item"><div class="details"><b>${esc(x.name)}</b><small>${esc(x.kind)} · ${new Date(x.deletedAt).toLocaleDateString('en-AU')}</small></div><button class="btn soft small" onclick="restoreDeleted('${x.kind}','${x.id}')">Restore</button></div>`).join(''):'<p class="muted">Nothing deleted.</p>'}function restoreDeleted(k,i){let x=trip()[k].find(x=>x.id===i);if(!x)return;delete x.deletedAt;if(save())notify('Item restored');else render()}
function searchDestination(q){selectedLocation=null;clearTimeout(locationTimer);const el=document.getElementById('locationSuggestions');if(!el)return;if(q.trim().length<2){el.innerHTML='';return}el.innerHTML='<div class="location-option muted">Searching destinations…</div>';locationTimer=setTimeout(async()=>{try{const r=await fetch('https://geocoding-api.open-meteo.com/v1/search?name='+encodeURIComponent(q.trim())+'&count=7&language=en&format=json');const j=await r.json();if(document.getElementById('destination')?.value!==q)return;locationMatches=j.results||[];el.innerHTML=locationMatches.length?locationMatches.map((g,i)=>`<button type="button" class="location-option" onclick="selectDestination(${i})"><span>📍</span><span><b>${esc(g.name)}</b><small>${esc([g.admin1,g.country].filter(Boolean).join(', '))}</small></span></button>`).join(''):'<div class="location-option muted">No matches — try another city</div>'}catch{el.innerHTML='<div class="location-option muted">Search unavailable. You can still type a destination.</div>'}},300)}function selectDestination(i){let g=locationMatches[i];if(!g)return;selectedLocation={name:g.name,country:g.country,latitude:g.latitude,longitude:g.longitude};document.getElementById('destination').value=[g.name,g.admin1,g.country].filter(Boolean).join(', ');document.getElementById('locationSuggestions').innerHTML=''}function saveTrip(){let t=trip();t.name=document.getElementById('tripName').value.trim()||'My trip';let d=document.getElementById('destination').value.trim();let same=d===t.destination;if(!same)weather=null;t.location=selectedLocation||(same?t.location:null);t.destination=d;t.start=document.getElementById('start').value;t.end=document.getElementById('end').value;if(save()){notify('Trip details saved');scheduleWeather(true)}else render()}
function toggleItem(i){let x=trip().items.find(x=>x.id===i);if(x)x.packed=!x.packed;if(save())notify('Packing progress saved');else render()}function addStarter(){let t=trip();for(let p of people())for(let s of starter)t.items.push({...s,id:id(),owner:p.id});if(save())notify('Starter packing lists added');else render()}function resetPacked(){if(confirm('Mark all packing items as unpacked?')){trip().items.forEach(x=>x.packed=false);save();render()}}
function remove(kind,i){if(!confirm('Move this item to Recently Deleted?'))return;let x=trip()[kind].find(x=>x.id===i);if(!x)return;x.deletedAt=new Date().toISOString();if(save())notify('Moved to Recently Deleted — restore in Trip setup');else render()}function removePerson(i){if(people().length===1)return alert('Keep at least one traveller.');if(!confirm('Remove this traveller? Their items will be kept in Recently Deleted.'))return;let t=trip();t.people=t.people.filter(x=>x.id!==i);['items','clothes','outfits'].forEach(k=>t[k].filter(x=>x.owner===i).forEach(x=>x.deletedAt=new Date().toISOString()));person='all';save();render()}
function openModal(type,i=''){modal={type,id:i};render()}function closeModal(){modal='';render()}function val(x){return document.getElementById(x)?.value||''}function ownerField(x,shared=true){return `<label class="field">Traveller<select id="owner">${personOptions(shared).replace(`value="${x?.owner||person}"`,`value="${x?.owner||person}" selected`)}</select></label>`}
function modalHTML(){let {type,id:i}=modal,t=trip(),x=type==='item'?t.items.find(x=>x.id===i):type==='clothing'?t.clothes.find(x=>x.id===i):type==='outfit'?t.outfits.find(x=>x.id===i):type==='person'?t.people.find(x=>x.id===i):null;let body='';
if(type==='item')body=`<div class="fields"><label class="field">Item name<input id="name" value="${esc(x?.name||'')}" placeholder="e.g. Sunglasses"></label>${ownerField(x)}<label class="field">Category<select id="category">${Object.keys(icons).map(c=>`<option ${x?.category===c?'selected':''}>${c}</option>`).join('')}</select></label><label class="field">Quantity<input id="qty" type="number" min="1" value="${x?.qty||1}"></label></div>`;
if(type==='clothing')body=`<div class="fields"><label class="field">Clothing name<input id="name" value="${esc(x?.name||'')}" placeholder="e.g. Black Nike tee"></label>${ownerField(x,false)}<label class="field">Type<select id="category">${[...clothingCategories,'Clothing'].map(c=>`<option ${x?.category===c?'selected':''}>${c}</option>`).join('')}</select></label><label class="field">Photo<input id="photo" type="file" accept="image/*"><small>Choose a photo from your device</small></label></div>${x?.photo?`<img src="${x.photo}" style="width:100px;border-radius:10px">`:''}`;
if(type==='person')body=`<label class="field">Traveller name<input id="name" value="${esc(x?.name||'')}" placeholder="e.g. Alex"></label>`;
if(type==='outfit'){let clothes=t.clothes.filter(c=>!c.deletedAt&&c.owner===(x?.owner||people()[0].id));body=`<div class="fields"><label class="field">Outfit name<input id="name" value="${esc(x?.name||'')}" placeholder="e.g. Dinner out"></label>${ownerField(x,false)}<label class="field">Occasion<input id="occasion" value="${esc(x?.occasion||'')}" placeholder="e.g. Sightseeing"></label>${['top','bottom','shoes'].map(k=>`<label class="field">${k[0].toUpperCase()+k.slice(1)}<select id="${k}"><option value="">None</option>${clothes.map(c=>`<option value="${c.id}" ${x?.[k]===c.id?'selected':''}>${esc(c.name)} (${esc(pName(c.owner))})</option>`).join('')}</select></label>`).join('')}</div><p class="note">For outfits, add clothing photos to the wardrobe first. Change traveller and reopen this form to see their clothing.</p>`}
if(type==='trips')body=`<div style="display:grid;gap:9px">${db.trips.map(a=>`<div class="item"><div class="details"><b>${esc(a.name)}</b><small>${esc(a.destination||'No destination')}</small></div><button class="btn soft small" onclick="switchTrip('${a.id}')">Open</button><button class="iconbtn" onclick="deleteTrip('${a.id}')">×</button></div>`).join('')}</div><div class="section"><button class="btn" onclick="newTrip()">+ New trip</button> <button class="btn ghost" onclick="duplicateTrip()">Duplicate current</button></div>`;
return `<div class="modalbg" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="section-head"><h2>${({item:i?'Edit item':'Add packing item',clothing:i?'Edit clothing':'Add clothing',person:i?'Edit traveller':'Add traveller',outfit:i?'Edit outfit':'Create outfit',trips:'Your trips'})[type]}</h2><button class="iconbtn" onclick="closeModal()">✕</button></div>${body}${type!=='trips'?`<footer><button class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn" onclick="submitModal()">Save</button></footer>`:''}</div></div>`}
async function submitModal(){let {type,id:i}=modal,t=trip(),name=val('name').trim();if(!name)return alert('Please enter a name.');if(type==='person'){let x=t.people.find(x=>x.id===i);if(x)x.name=name;else t.people.push({id:id(),name})}else{let k={item:'items',clothing:'clothes',outfit:'outfits'}[type],x=t[k].find(x=>x.id===i),obj={...(x||{}),id:i||id(),name,owner:val('owner')||people()[0].id};if(type==='item'){obj.category=val('category');obj.qty=Math.max(1,Number(val('qty'))||1);obj.packed=x?.packed||false}if(type==='clothing'){obj.category=val('category');let f=document.getElementById('photo').files[0];if(f){try{obj.photo=await shrink(f)}catch(e){return alert('Could not read photo')}}}if(type==='outfit'){obj.occasion=val('occasion');for(let v of ['top','bottom','shoes'])obj[v]=val(v)}if(x)Object.assign(x,obj);else t[k].push(obj)}if(save()){modal='';notify(type==='person'?'Traveller saved':type==='item'?'Packing item saved':type==='clothing'?'Wardrobe item saved':'Outfit saved')}else closeModal()}
function shrink(file){return new Promise((resolve,reject)=>{let reader=new FileReader();reader.onload=()=>{let im=new Image();im.onload=()=>{let c=document.createElement('canvas'),scale=Math.min(1,800/Math.max(im.width,im.height));c.width=Math.round(im.width*scale);c.height=Math.round(im.height*scale);c.getContext('2d').drawImage(im,0,0,c.width,c.height);resolve(c.toDataURL('image/jpeg',.7))};im.onerror=reject;im.src=reader.result};reader.onerror=reject;reader.readAsDataURL(file)})}
function switchTrip(i){db.active=i;person='all';weather=null;weatherKey='';if(save()){modal='';notify('Trip opened');scheduleWeather(true)}else render()}function newTrip(){let t={id:id(),name:'New trip',destination:'',start:'',end:'',people:[{id:id(),name:'Traveller 1'}],items:[],clothes:[],outfits:[]};db.trips.push(t);switchTrip(t.id);go('settings')}function duplicateTrip(){let t=structuredClone(trip());t.id=id();t.name+=' (copy)';t.items.forEach(x=>x.packed=false);db.trips.push(t);switchTrip(t.id)}function deleteTrip(i){if(db.trips.length<2)return alert('Keep at least one trip.');if(!confirm('Archive this trip? You can restore it from a JSON backup. Export a backup first.'))return;exportData();db.trips=db.trips.filter(x=>x.id!==i);if(db.active===i)db.active=db.trips[0].id;save();render()}function exportData(){let b=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='dfs-packing-backup.json';a.click();URL.revokeObjectURL(a.href)}async function importData(el){let f=el.files[0];if(!f)return;try{let v=JSON.parse(await f.text());if(!Array.isArray(v.trips)||!v.trips.length)throw Error();if(confirm('Replace your existing trips with this backup?')){db=v;db.active=db.trips.some(t=>t.id===v.active)?v.active:db.trips[0].id;save();render()}}catch{alert('Invalid backup file')}}render();scheduleWeather();
</script></body></html>
