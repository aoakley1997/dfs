function cloudStatus(message){cloudState=message;const el=document.getElementById('dfs-sync-state');if(el)el.textContent=message;const side=document.getElementById('cloud-state');if(side&&cloudUser)side.textContent='Signed in as '+(cloudUser.email||'user')+' · '+message}

function auDate(iso){if(!/^\d{4}-\d{2}-\d{2}$/.test(iso||''))return iso||'';const [y,m,d]=iso.split('-').map(Number);return new Date(Date.UTC(y,m-1,d)).toLocaleDateString('en-AU',{day:'numeric',month:'short',year:'numeric',timeZone:'UTC'});}function auDateRange(start,end){if(!start)return '';if(!end)return auDate(start);if(start.slice(0,7)===end.slice(0,7)){const [y,m,d]=start.split('-').map(Number);return d+'–'+Number(end.slice(8))+' '+new Date(Date.UTC(y,m-1,1)).toLocaleDateString('en-AU',{month:'long',year:'numeric',timeZone:'UTC'});}return auDate(start)+' – '+auDate(end);}

const clothingCategories=['Top','Bottom','Dress','Shorts','Jacket','Shoes','Swimwear','Underwear','Accessories','Sleepwear','Other'];let locationMatches=[],locationTimer=null,selectedLocation=null,wardrobeCategory="All";let weatherKey='',weatherLastAttempt=0;let toastMessage='',toastTimer=null;let tab='dashboard',person='all',modal='',weather=null,weatherError='',weatherLoading=false;const trip=()=>db.trips.find(t=>t.id===db.active);const save=()=>{if(!window.dfsCloudReady?.()){alert('Cloud is still loading. Please wait before editing.');return false}return window.dfsCloudSave()};function notify(msg='Saved successfully'){toastMessage=msg;clearTimeout(toastTimer);render();toastTimer=setTimeout(()=>{toastMessage='';render()},2800)};const people=()=>trip().people;const pName=pid=>pid==='shared'?'Shared':people().find(p=>p.id===pid)?.name||'Unknown';const personOptions=(shared=true)=>people().map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')+(shared?'<option value="shared">Shared essentials</option>':'');const scoped=arr=>arr.filter(x=>!x.deletedAt&&(person==='all'||x.owner===person));const count=()=>{let a=trip().items.filter(x=>!x.deletedAt);return [a.filter(x=>x.packed).length,a.length]};const navs=[['dashboard','⌂','Home'],['packing','☑','Packing lists'],['wardrobe','♧','Wardrobe'],['outfits','✧','Outfits'],['settings','⚙','Trips & settings']];
function render(){const t=trip(),[done,total]=count(),pct=total?Math.round(done/total*100):0;document.getElementById('app').innerHTML=`<div class="shell"><aside class="sidebar"><div class="logo">DFS<span>!</span> <span class="logo-plane">✈</span></div><div class="brand-subtitle">Don’t Forget Your Shit!</div><nav>${navs.map(n=>`<button class="nav ${tab===n[0]?'active':''}" onclick="go('${n[0]}')">${n[1]} &nbsp; ${n[2]}</button>`).join('')}</nav><div id="firebase-status"></div><button class="legacy-import" type="button" onclick="window.dfsImportLegacy()">Import older browser trips</button><div class="sidebar-footer"><div class="sidebar-decor">✈︎</div><div class="note">Cloud sync is enabled for this account.<br>Weather powered by Open-Meteo.</div></div></aside><main class="main"><div class="mobile-app-header"><div class="mobile-brand">DFS<span>!</span><small>DON’T FORGET YOUR SHIT</small></div><details class="mobile-account"><summary aria-label="Open account menu">☰</summary><div class="mobile-account-menu"><div class="mobile-account-title">My account</div><div class="mobile-email" id="mobile-email">Signed in</div><button onclick="openModal('trips');document.querySelector('.mobile-account')?.removeAttribute('open')">⇄ Switch trip</button><button onclick="window.dfsImportLegacy()">↥ Import older trips</button><button onclick="exportData()">↓ Download backup</button><button onclick="window.dfsSignOut()">↪ Sign out</button></div></details></div><div class="sync-banner"><span class="sync-cloud">☁</span><div class="sync-copy"><strong id="dfs-sync-state">Checking cloud…</strong><small>Account changes and backups</small></div><button type="button" onclick="exportData()">↓ Backup</button></div><div class="top"><div><div class="eyebrow">PACK TOGETHER. FORGET NOTHING.</div><h1>${({dashboard:'Ready for your next adventure?',packing:'Packing lists',wardrobe:'Your wardrobe',outfits:'Outfit planner',settings:'Trips & settings'})[tab]}</h1></div><button class="btn ghost" onclick="new function dashboard(){let t=trip(),[done,total]=count(),pct=total?Math.round(done/total*100):0;let clothes=t.clothes.filter(x=>!x.deletedAt),looks=t.outfits.filter(x=>!x.deletedAt);return `<div class="dashboard-layout"><section class="trip-feature"><div class="trip-feature-top"><span class="feature-tag">✈ CURRENT TRIP</span><button class="feature-more" onclick="openModal('trips')" title="Switch trips">•••</button></div><div class="trip-feature-content"><div class="eyebrow">YOUR NEXT ADVENTURE</div><h2>${esc(t.name)}</h2><p>${esc(t.destination||'Destination not set')}</p><div class="feature-dates">▦ ${esc(auDateRange(t.start,t.end)||'Set your travel dates')}</div><div class="feature-buttons"><button class="btn" onclick="go('packing')">Continue packing →</button><button class="btn ghost" onclick="go('settings')">Edit trip</button></div></div></section><section class="card dashboard-weather"><div class="section-head"><h2>☀ Weather ${t.destination?'in '+esc(t.destination):''}</h2><button class="iconbtn" onclick="loadWeather(true)" title="Refresh weather">↻</button></div>${weatherHTML()}</section><section class="card progress-card"><div class="section-head"><h2>▣ Packing progress</h2><span class="progress-number">${pct}% packed</span></div><div class="progress-track"><div style="width:${pct}%"></div></div><p class="muted">${done} of ${total} items packed · ${people().length} traveller${people().length===1?'':'s'}</p></section><section class="card preview-card"><div class="section-head"><h2>♧ Planned outfits <span>(${looks.length})</span></h2><button class="text-link" onclick="go('outfits')">View all →</button></div><div class="preview-grid">${looks.slice(0,4).map(x=>`<button class="preview-tile" onclick="go('outfits')"><div class="preview-icon">✧</div><small>${esc(x.name)}</small></button>`).join('')||'<div class="preview-empty">No outfits yet. Start planning your looks.</div>'}</div></section><section class="card preview-card"><div class="section-head"><h2>♧ Wardrobe <sp function weatherHTML(){let t=trip();if(!t.destination)return `<p class="muted">Add a destination in Trip setup to see the forecast.</p><button class="btn soft" onclick="go('settings')">Set destination</button>`;if(weatherLoading)return '<p class="muted">Checking the forecast…</p>';if(weatherError)return `<p class="muted">${esc(weatherError)}</p><button class="btn soft" onclick="loadWeather(true)">Try again</button>`;if(!weather)return `<p class="muted">Weather will load automatically for ${esc(t.destination)}.</p><button class="btn soft" onclick="loadWeather(true)">Load now</button>`;let c=weather.current;let days=weather.daily.time.map((d,i)=>({d,i}));let tripStart=t.start?new Date(t.start+'T12:00'):null;let tripEnd=t.end?new Date(t.end+'T12:00'):null;let travelDays=days.filter(({d})=>{let dt=new Date(d+'T12:00');return tripStart&&dt>=tripStart&&(!tripEnd||dt<=tripEnd)});let display=travelDays.length?travelDays:days.slice(0,7);return `<div class="weather"><div style="font-size:45px">${symbol(c.weather_code)}</div><div><div class="temp">${Math.round(c.temperature_2m)}°C</div><div class="muted">Currently in ${esc(weather.place)} · Wind ${Math.round(c.wind_speed_10m)} km/h</div></div></div><div class="weather-days">${display.map(({d,i})=>{let dt=new Date(d+'T12:00'),tripDay=tripStart&&dt>=tripStart?Math.floor((dt-tripStart)/86400000)+1:null;return `<div class="day"><strong>${tripDay?'Day '+tripDay:'Forecast'}</strong><div>${dt.toLocaleDateString('en-AU',{weekday:'short',day:'numeric',month:'short'})}</div><div style="font-size:23px">${symbol(weather.daily.weather_code[i])}</div><b>${Math.round(weather.daily.temperature_2m_max[i])}° / ${Math.round(weather.daily.temperature_2m_min[i])}°</b></div>`}).join('')}</div><p class="note">${travelDays.length?'Forecast days overlapping your trip are shown.':'Showing upcoming forecast dates — your trip dates are outside the available forecast window.'} Open-Meteo forecasts are generally limited to around 16 days ahead.</p>`}

async function getJson(url,ms=9000){let controller=new AbortController(),timer=setTimeout(()=>controller.abort(),ms);try{let r=await fetch(url,{signal:controller.signal});if(!r.ok)throw Error('Weather service returned '+r.status);return await r.json()}finally{clearTimeout(timer)}}
async function loadWeather(force=false){let t=trip(),dest=t.destination.trim(),tripId=t.id;if(!dest||weatherLoading)return;let key=[t.id,dest,t.start,t.end].join('|');if(!force&&weatherKey===key&&Date.now()-weatherLastAttempt<600000)return;weatherKey=key;weatherLastAttempt=Date.now();weather=null;weatherError='';weatherLoading=true;render();try{let g=t.location;if(!g||!Number.isFinite(Number(g.latitude))){let query=dest.split(',')[0].trim();let geo=await getJson('https://geocoding-api.open-meteo.com/v1/search?name='+encodeURIComponent(query)+'&count=7&language=en&format=json');if(!geo.results?.length)throw Error('Destination not found. Choose a city from Trip setup.');g=geo.results[0];let country=dest.split(',').map(x=>x.trim()).at(-1);let matching=geo.results.find(x=>x.country.toLowerCase()===country.toLowerCase());if(matching)g=matching}let u=`https://api.open-meteo.com/v1/forecast?latitude=${g.latitude}&longitude=${g.longitude}&current=temperature_2m,weather_code,wind_speed_10m&daily=weather_code,temperature_2m_max,temperature_2m_min&forecast_days=16&timezone=auto`;let result=await getJson(u);if(!result.current||!result.daily)throw Error('No forecast was returned.');if(trip().id!==tripId)return;weather=result;weather.place=g.name+', '+g.country}catch(e){if(trip().id!==tripId)return;weatherError=e.name==='AbortError'?'Weather request timed out. Check your connection and try again.':(e instanceof TypeError?'Unable to connect to the weather service. If you opened the HTML directly, try the hosted app once deployed.':e.message)}finally{if(trip().id===tripId){weatherLoading=false;render()}}}

function packing(){let a=scoped(trip().items);return `${tabsPeople()}<div class="section-head"><div><h2>Checklist</h2><div class="muted">${a.filter(x=>x.packed).length} of ${a.length} packed</div></div><button class="btn" onclick="openModal('item')">+ Add item</button></div>${a.length?Object.keys(icons).map(cat=>{let b=a.filter(x=>x.category===cat);return b.length?`<div class="section"><div class="section-head"><h3>${icons[cat]} ${cat}</h3><span class="pill">${b.filter(x=>x.packed).length}/${b.length}</span></div><div class="items">${b.map(x=>`<div class="item"><button class="tick ${x.packed?'checked':''}" onclick="toggleItem('${x.id}')">${x.packed?'✓':''}</button>${packingThumbnail(x)}<div class="details"><b style="${x.packed?'text-decoration:line-through;opacity:.55':''}">${esc(x.name)}</b><small>${esc(pName(x.owner))} · Qty ${x.qty}${linkedGarment(x)?' · ♧ Wardrobe linked':''}</small></div><button class="iconbtn" title="Edit" onclick="openModal('item','${x.id}')">✎</button><button class="iconbtn" title="Delete" onclick="remove('items','${x.id}')">×</button></div>`).join('')}</div></div>`:''}).join(''):`<div class="empty">No items yet. Add items, or load the starter essentials for each traveller.<br><br><button class="btn" onclick="addStarter()">Add starter packing lists</button></div>`}<div class="section"><button class="btn ghost" onclick="window.print()">Print checklist</button> <button class="btn ghost" onclick="resetPacked()">Reset packed status</button></div>`}

plication/json" style="display:none" onchange="importData(this)"></label></div>`}
function deletedHTML(){let t=trip(),a=['items','clothes','outfits'].flatMap(k=>t[k].filter(x=>x.deletedAt).map(x=>({...x,kind:k})));return a.length?a.map(x=>`<div class="item"><div class="details"><b>${esc(x.name)}</b><small>${esc(x.kind)} · ${new Date(x.deletedAt).toLocaleDateString('en-AU')}</small></div><button class="btn soft small" onclick="restoreDeleted('${x.kind}','${x.id}')">Restore</button></div>`).join(''):'<p class="muted">Nothing deleted.</p>'}function restoreDeleted(k,i){let x=trip()[k].find(x=>x.id===i);if(!x)return;delete x.deletedAt;if(k==='clothes')for(const p of trip().items.filter(p=>p.wardrobeId===i))delete p.deletedAt;if(save())notify('Item restored');else render()}
function searchDestination(q){selectedLocation=null;clearTimeout(locationTimer);const el=document.getElementById('locationSuggestions');if(!el)return;if(q.trim().length<2){el.innerHTML='';return}el.innerHTML='<div class="location-option muted">Searching destinations…</div>';locationTimer=setTimeout(async()=>{try{const r=await fetch('https://geocoding-api.open-meteo.com/v1/search?name='+encodeURIComponent(q.trim())+'&count=7&language=en&format=json');const j=await r.json();if(document.getElementById('destination')?.value!==q)return;locationMatches=j.results||[];el.innerHTML=locationMatches.length?locationMatches.map((g,i)=>`<button type="button" class="location-option" onclick="selectDestination(${i})"><span>📍</span><span><b>${esc(g.name)}</b><small>${esc([g.admin1,g.country].filter(Boolean).join(', '))}</small></span></button>`).join(''):'<div class="location-option muted">No matches — try another city</div>'}catch{el.innerHTML='<div class="location-option muted">Search unavailable. You can still type a destination.</div>'}},300)}function selectDestination(i){let g=locationMatches[i];if(!g)return;selectedLocation={name:g.name,country:g.country,latitude:g.latitude,longitude:g.longitude};document.getElementById('destination').value=[g.name,g.admin1,g.country].filter(Boolean).join(', ');document.getElementById('locationSuggestions').innerHTML=''}function saveTrip(){let t=trip();t.name=document.getElementById('tripName').value.trim()||'My trip';let d=document.getElementById('destination').value.trim();let same=d===t.destination;if(!same)weather=null;t.location=selectedLocation||(same?t.location:null);t.destination=d;t.start=document.getElementById('start').value;t.end=document.getElementById('end').value;if(save()){notify('Trip details saved');scheduleWeather(true)}else render()}
function addGarmentToPacking(i){const c=trip().clothes.find(x=>x.id===i&&!x.deletedAt);if(!c)return;ensurePackingForClothing(c);if(save())notify('Clothing linked to packing list')}
function toggleItem(i){let x=trip().items.find(x=>x.id===i);if(x)x.packed=!x.packed;if(save())notify('Packing progress saved');else render()}function addStarter(){let t=trip();for(let p of people())for(let s of starter)t.items.push({...s,id:id(),owner:p.id});if(save())notify('Starter packing lists added');else render()}function resetPacked(){if(confirm('Mark all packing items as unpacked?')){trip().items.forEach(x=>x.packed=false);save();render()}}
function remove(kind,i){if(!confirm('Move this item to Recently Deleted?'))return;let x=trip()[kind].find(x=>x.id===i);if(!x)return;x.deletedAt=new Date().toISOString();if(kind==='clothes')for(const p of trip().items.filter(p=>p.wardrobeId===i))p.deletedAt=x.deletedAt;if(save())notify('Moved to Recently Deleted — restore in Trip setup');else render()}function removePerson(i){if(people().length===1)return alert('Keep at least one traveller.');if(!confirm('Remove this traveller? Their items will be kept in Recently Deleted.'))return;let t=trip();t.people=t.people.filter(x=>x.id!==i);['items','clothes','outfits'].forEach(k=>t[k].filter(x=>x.owner===i).forEach(x=>x.deletedAt=new Date().toISOString()));person='all';save();render()}
function openModal(type,i=''){modal={type,id:i};render()}function closeModal(){modal='';render()}function val(x){return document.getElementById(x)?.value||''}function ownerField(x,shared=true){return `<label class="field">Traveller<select id="owner">${personOptions(shared).replace(`value="${x?.owner||person}"`,`value="${x?.owner||person}" selected`)}</select></label>`}
function modalHTML(){let {type,id:i}=modal,t=trip(),x=type==='item'?t.items.find(x=>x.id===i):type==='clothing'?t.clothes.find(x=>x.id===i):type==='outfit'?t.outfits.find(x=>x.id===i):type==='person'?t.people.find(x=>x.id===i):null;let body='';
if(type==='item')body=`<div class="fields"><label class="field">Item name<input id="name" value="${esc(x?.name||'')}" placeholder="e.g. Sunglasses"></label>${ownerField(x)}<label class="field">Category<select id="category">${Object.keys(icons).map(c=>`<option ${x?.category===c?'selected':''}>${c}</option>`).join('')}</select></label><label class="field">Quantity<input id="qty" type="number" min="1" value="${x?.qty||1}"></label></div><div class="wardrobe-link"><label class="field">Wardrobe item (optional)<select id="wardrobeLink"><option value="">No wardrobe link</option>${trip().clothes.filter(c=>!c.deletedAt).map(c=>`<option value="${esc(c.id)}" ${x?.wardrobeId===c.id?'selected':''}>${esc(c.name)} · ${esc(pName(c.owner))}</option>`).join('')}</select></label><p class="muted">For clothing, select an existing wardrobe item or tick “Add to wardrobe” below.</p><label class="link-checkbox"><input id="addToWardrobe" type="checkbox" ${x?.wardrobeId?'disabled':''}> Add this packing item to my wardrobe</label></div>`;
if(type==='clothing')body=`<div class="fields"><label class="field">Clothing name<input id="name" value="${esc(x?.name||'')}" placeholder="e.g. Black Nike tee"></label>${ownerField(x,false)}<label class="field">Type<select id="category">${[...clothingCategories,'Clothing'].map(c=>`<option ${x?.category===c?'selected':''}>${c}</option>`).join('')}</select></label><label class="field">Photo<input id="photo" type="file" accept="image/*"><small>Choose a photo from your device</small></label></div>${x?.photo?`<img src="${x.photo}" style="width:100px;border-radius:10px">`:''}`;
if(type==='person')body=`<label class="field">Traveller name<input id="name" value="${esc(x?.name||'')}" placeholder="e.g. Alex"></label>`;
if(type==='outfit'){let clothes=t.clothes.filter(c=>!c.deletedAt&&c.owner===(x?.owner||people()[0].id));body=`<div class="fields"><label class="field">Outfit name<input id="name" value="${esc(x?.name||'')}" placeholder="e.g. Dinner out"></label>${ownerField(x,false)}<label class="field">Occasion<input id="occasion" value="${esc(x?.occasion||'')}" placeholder="e.g. Sightseeing"></label>${['top','bottom','shoes'].map(k=>`<label class="field">${k[0].toUpperCase()+k.slice(1)}<select id="${k}"><option value="">None</option>${clothes.map(c=>`<option value="${c.id}" ${x?.[k]===c.id?'selected':''}>${esc(c.name)} (${esc(pName(c.owner))})</option>`).join('')}</select></label>`).join('')}</div><p class="note">For outfits, add clothing photos to the wardrobe first. Change traveller and reopen this form to see their clothing.</p>`}
if(type==='trips')body=`<div style="display:grid;gap:9px">${db.trips.map(a=>`<div class="item"><div class="details"><b>${esc(a.name)}</b><small>${esc(a.destination||'No destination')}</small></div><button class="btn soft small" onclick="switchTrip('${a.id}')">Open</button><button class="iconbtn" onclick="deleteTrip('${a.id}')">×</button></div>`).join('')}</div><div class="section"><button class="btn" onclick="newTrip()">+ New trip</button> <button class="btn ghost" onclick="duplicateTrip()">Duplicate current</button></div>`;
return `<div class="modalbg" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="section-head"><h2>${({item:i?'Edit item':'Add packing item',clothing:i?'Edit clothing':'Add clothing',person:i?'Edit traveller':'Add traveller',outfit:i?'Edit outfit':'Create outfit',trips:'Your trips'})[type]}</h2><button class="iconbtn" onclick="closeModal()">✕</button></div>${body}${type!=='trips'?`<footer><button class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn" onclick="submitModal()">Save</button></footer>`:''}</div></div>`}
async function submitModal(){let {type,id:i}=modal,t=trip(),name=val('name').trim();if(!name)return alert('Please enter a name.');if(type==='person'){let x=t.people.find(x=>x.id===i);if(x)x.name=name;else t.people.push({id:id(),name})}else{let k={item:'items',clothing:'clothes',outfit:'outfits'}[type],x=t[k].find(x=>x.id===i),obj={...(x||{}),id:i||id(),name,owner:val('owner')||people()[0].id};if(type==='item'){obj.category=val('category');obj.qty=Math.max(1,Number(val('qty'))||1);obj.packed=x?.packed||false;const linked=val('wardrobeLink');if(linked){const c=t.clothes.find(c=>c.id===linked&&!c.deletedAt);if(c){obj.wardrobeId=c.id;obj.name=c.name;obj.owner=c.owner;obj.category='Clothing'}}else if(document.getElementById('addToWardrobe')?.checked){ensureWardrobeForPacking(obj,'Other');obj.category='Clothing'}else if(x?.wardrobeId){delete obj.wardrobeId}}if(type==='clothing'){obj.category=val('category');let f=document.getElementById('photo').files[0];if(f){try{obj.photo=await shrink(f)}catch(e){return alert('Could not read photo')}}}if(type==='outfit'){obj.occasion=val('occasion');for(let v of ['top','bottom','shoes'])obj[v]=val(v)}if(x)Object.assign(x,obj);else t[k].push(obj);if(type==='clothing'){ensurePackingForClothing(obj);syncLinkedPacking(obj)}if(type==='item'&&obj.wardrobeId){const c=t.clothes.find(c=>c.id===obj.wardrobeId);if(c){obj.name=c.name;obj.owner=c.owner;obj.category='Clothing';const duplicate=t.items.find(p=>p.id!==obj.id&&p.wardrobeId===c.id&&!p.deletedAt);if(duplicate){if(x){x.deletedAt=new Date().toISOString()}else{t.items=t.items.filter(p=>p.id!==obj.id)}duplicate.qty=obj.qty;duplicate.packed=obj.packed}else if(x){Object.assign(x,obj)}}}}if(save()){modal='';notify(type==='person'?'Traveller saved':type==='item'?'Packing item saved':type==='clothing'?'Wardrobe item saved':'Outfit saved')}else closeModal()}
function shrink(file){return new Promise((resolve,reject)=>{let reader=new FileReader();reader.onload=()=>{let im=new Image();im.onload=()=>{let c=document.createElement('canvas'),scale=Math.min(1,800/Math.max(im.width,im.height));c.width=Math.round(im.width*scale);c.height=Math.round(im.height*scale);c.getContext('2d').drawImage(im,0,0,c.width,c.height);resolve(c.toDataURL('image/jpeg',.7))};im.onerror=reject;im.src=reader.result};reader.onerror=reject;reader.readAsDataURL(file)})}
function switchTrip(i){db.active=i;person='all';weather=null;weatherKey='';if(save()){modal='';notify('Trip opened');scheduleWeather(true)}else render()}function newTrip(){let t={id:id(),name:'New trip',destination:'',start:'',end:'',people:[{id:id(),name:'Traveller 1'}],items:[],clothes:[],outfits:[]};db.trips.push(t);switchTrip(t.id);go('settings')}function duplicateTrip(){let t=structuredClone(trip());t.id=id();t.name+=' (copy)';t.items.forEach(x=>x.packed=false);db.trips.push(t);switchTrip(t.id)}function deleteTrip(i){if(db.trips.length<2)return alert('Keep at least one trip.');if(!confirm('Archive this trip? A backup will download first.'))return;exportData();db.trips=db.trips.filter(x=>x.id!==i);if(db.active===i)db.active=db.trips[0].id;save();render()}function exportData(){let b=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='dfs-packing-backup.json';a.click();URL.revokeObjectURL(a.href)}async function importData(el){let f=el.files[0];if(!f)return;try{let v=JSON.parse(await f.text());if(!Array.isArray(v.trips)||!v.trips.length)throw Error();if(confirm('Replace your existing trips with this backup?')){db=v;db.active=db.trips.some(t=>t.id===v.active)?v.active:db.trips[0].id;save();render()}}catch{alert('Invalid backup file')}}render();scheduleWeather();
</script></body></html>
